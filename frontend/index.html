<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Scheduler</title>
    <link rel="stylesheet" href="css/style.css">
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css' rel='stylesheet' />
</head>
<body>
    <h1>Welcome to Task Scheduler</h1>

    <div class="container">
        <h2>Task Form</h2>
        <form id="task-form">
            <input type="hidden" id="task-id">

            <div>
                <label for="task-name">Task Title/Summary:</label>
                <input type="text" id="task-name" required>
            </div>

            <div>
                <label for="task-action">Task Action:</label>
                <select id="task-action" name="task-action" required></select>
            </div>

            <div>
                <label for="task-description">Additional Details/Notes:</label>
                <textarea id="task-description" name="task-description" rows="3"></textarea> <!-- Removed required for more flexibility -->
            </div>

            <div>
                <label for="task-date">Date:</label>
                <input type="date" id="task-date" required>
            </div>

            <div>
                <label for="task-time">Time:</label>
                <input type="time" id="task-time" required>
            </div>

            <div>
                <label for="task-system">Target System:</label>
                <select id="task-system" name="task-system" required></select>
            </div>

            <button type="submit" id="save-task-btn">Save Task</button>
            <button type="button" id="clear-form-btn">Clear Form / Cancel Edit</button>
        </form>

        <h2>Current Tasks</h2>
        <div class="filters">
            <label for="filter-date">Filter by Date:</label>
            <input type="date" id="filter-date">
            <label for="filter-week">Filter by Week:</label>
            <input type="week" id="filter-week">
            <label for="filter-month">Filter by Month:</label>
            <input type="month" id="filter-month">
            <label for="filter-year">Filter by Year:</label>
            <input type="number" id="filter-year" placeholder="YYYY" min="1900" max="2100">
            <button id="apply-filters-btn">Apply Filters</button>
            <button id="clear-filters-btn">Clear Filters</button>
        </div>
        <table id="task-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Target System</th>
                    <th>Action/Command</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="task-table-body">
                <!-- Task rows will be inserted here by JavaScript -->
            </tbody>
        </table>

        <h2>Task Calendar</h2>
        <div id='calendar'></div>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.js'></script>
    <script src="js/app.js"></script>
</body>
</html>
